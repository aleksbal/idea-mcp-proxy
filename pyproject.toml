[project]
name = "idea-mcp-proxy"
version = "0.1.0"
description = "Reverse proxy for the JetBrains IDE MCP server that trims verbose tool output (starting with analyze_calls) before it reaches an LLM's context."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idea_mcp_proxy*"]
